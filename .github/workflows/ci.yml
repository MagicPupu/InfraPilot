name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Database only (pgvector): exercises the checkpointer and retrieval SQL. No Ollama.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: infrapilot
          POSTGRES_PASSWORD: infrapilot
          POSTGRES_DB: infrapilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U infrapilot" --health-interval 3s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests evals
      - run: uv run ruff format --check src tests evals
      - run: uv run mypy
      # FakeLLM only: CI never pulls or runs Ollama, and evals are local-only.
      - run: uv run pytest -m "not ollama"
